# Demo inventory shipped with the public Medusa release. Replace with
# your own hosts and zones; this file exists so a fresh clone can run
# `medusa validate` and `medusa render` end-to-end without editing
# anything first.
zones:
- name: lan
  upstreams: [9.9.9.9, 1.1.1.1]
  # HTTPS on a public domain you own, with .lan kept as redirects: uncomment
  # both blocks, list the second zone on every proxy host below, and give the
  # traefik service an `acme` block (see services.yaml). Public DNS needs no
  # records for the second zone; CoreDNS answers for it locally.
  # redirect_to: internal.example.com
# - name: internal.example.com
#   tls: acme

hosts:
- name: host01
  ip: 10.0.0.10
  zones: [lan]
  aliases: [storage]
- name: host02
  ip: 10.0.0.20
  zones: [lan]
  aliases: []
  # A host that carries services must claim its deploy platform; the
  # deploy user is the SSH user nixos-rebuild connects as.
  deploy_user: root
  platform: nixos
- name: host03
  ip: 10.0.0.30
  zones: [lan]
  aliases: []
- name: dns01
  ip: 10.0.0.250
  zones: [lan]
  aliases: [dns]
