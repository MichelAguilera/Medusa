[defaults]
inventory = ../generated/ansible/inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
local_tmp = .cache/tmp
remote_tmp = /tmp/.ansible-${USER}/tmp

[ssh_connection]
ssh_args = -F /dev/null -C -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = .cache/cp
# Pipelining streams the module over the SSH session instead of writing a
# temp file the become_user must then be granted read access to. Required for
# clean `become_user: medusa` (the service-runtime identity that runs Compose)
# without world-readable tmpfiles. Safe here: the ansible user's sudoers
# disables requiretty.
pipelining = True
usetty = False
