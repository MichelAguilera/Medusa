---
- name: Verify generated artifacts are current
  hosts: medusa_control
  gather_facts: false
  roles:
    - preflight

# Cut managed-network hosts over to their canonical static IP before anything
# depends on them being there. Runs before CoreDNS because the DNS box itself
# may be a managed-network host. A host whose cutover fails is dropped from the
# run (its rescue fails it); later plays skip it rather than deploying onto a
# half-cut host. See T-055.
- name: Cut managed hosts over to static IPs
  hosts: managed_network_hosts
  gather_facts: false
  roles:
    - network_cutover

- name: Deploy CoreDNS artifacts
  hosts: coredns_hosts
  gather_facts: false
  roles:
    - coredns

- name: Prepare managed Docker stack root
  hosts: docker_hosts
  gather_facts: false
  roles:
    - deploy_root

- name: Deploy managed NFS exports
  hosts: nfs_export_hosts
  gather_facts: false
  roles:
    - nfs_exports

- name: Mount managed shared storage
  hosts: storage_hosts
  gather_facts: false
  roles:
    - storage

- name: Deploy Traefik dynamic config
  hosts: traefik_hosts
  gather_facts: false
  roles:
    - traefik

- name: Deploy Homepage config
  hosts: homepage_hosts
  gather_facts: false
  roles:
    - homepage

- name: Deploy monitoring config
  hosts: monitoring_hosts
  gather_facts: false
  roles:
    - monitoring

- name: Deploy managed secrets
  hosts: docker_hosts
  gather_facts: false
  roles:
    - secrets

- name: Deploy Docker Compose stack files
  hosts: docker_hosts
  gather_facts: false
  roles:
    - compose
