---
- name: Verify generated artifacts are current
  hosts: medusa_control
  gather_facts: false
  roles:
    - preflight

# Cut managed-network hosts over to their canonical static IP before anything
# depends on them being there. Runs before CoreDNS because the DNS box itself
# may be a managed-network host. A host whose cutover fails is dropped from the
# run (its rescue fails it); later plays skip it rather than deploying onto a
# half-cut host. See T-055.
- name: Cut managed hosts over to static IPs
  hosts: managed_network_hosts
  gather_facts: false
  roles:
    - network_cutover

- name: Deploy CoreDNS artifacts
  hosts: coredns_hosts
  gather_facts: false
  roles:
    - coredns

# Bring up the shared WireGuard egress gateway before any tunneled container
# starts, so the tunnel network's split resolver and NAT/kill-switch exist when
# compose attaches services to it. Ordered after CoreDNS because the gateway's
# split DNS forwards managed zones there. See T-066.
- name: Configure the WireGuard egress gateway
  hosts: egress_gateway_hosts
  gather_facts: false
  roles:
    - wireguard_gateway

- name: Install the Docker engine on managed Docker hosts
  hosts: docker_hosts
  gather_facts: false
  roles:
    - docker_engine

- name: Prepare managed Docker stack root
  hosts: docker_hosts
  gather_facts: false
  roles:
    - deploy_root

# Create the tunnel network + split policy routing on Docker hosts that run a
# tunneled service, before any tunneled stack comes up (the external network
# must exist, and traffic must be routed through the gateway). See T-066.
- name: Configure tunnel routing on Docker hosts
  hosts: tunnel_routing_hosts
  gather_facts: false
  roles:
    - tunnel_routing

- name: Deploy managed NFS exports
  hosts: nfs_export_hosts
  gather_facts: false
  roles:
    - nfs_exports

- name: Mount managed shared storage
  hosts: storage_hosts
  gather_facts: false
  roles:
    - storage

- name: Deploy Traefik dynamic config
  hosts: traefik_hosts
  gather_facts: false
  roles:
    - traefik

- name: Deploy Homepage config
  hosts: homepage_hosts
  gather_facts: false
  roles:
    - homepage

- name: Deploy monitoring config
  hosts: monitoring_hosts
  gather_facts: false
  roles:
    - monitoring

- name: Deploy managed secrets
  hosts: docker_hosts
  gather_facts: false
  roles:
    - secrets

- name: Deploy Docker Compose stack files
  hosts: docker_hosts
  gather_facts: false
  roles:
    - compose
