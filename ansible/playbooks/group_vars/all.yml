---
# Local checkout root. playbook_dir is ansible/playbooks. This is the
# code repo (public Medusa), where playbooks, roles, and templates live.
medusa_project_root: "{{ playbook_dir }}/../.."
# Inventory repo (private medusa-inventory). Defaults to the dev tree's
# single-root layout (code repo itself); the controller overrides via
# the MEDUSA_INVENTORY_ROOT env var that medusactl exports.
medusa_inventory_root: "{{ lookup('env', 'MEDUSA_INVENTORY_ROOT') | default(medusa_project_root, true) }}"
# Generated artifacts. Default lives under the code repo for the dev
# workspace; on the controller, medusactl exports MEDUSA_GENERATED_DIR
# (typically ~/.local/state/medusa/generated).
medusa_generated_dir: "{{ lookup('env', 'MEDUSA_GENERATED_DIR') | default(medusa_project_root + '/generated', true) }}"
# SOPS-encrypted secret files referenced by secrets-manifest.yaml.
# Lives in the inventory repo: paths in secrets-manifest are relative
# to this root (e.g. 'secrets/foo/bar.sops.yaml').
medusa_secrets_root: "{{ medusa_inventory_root }}"
# tmpfs root every host decrypts its own secret plaintext into (T-080). MUST
# match Medusa's SECRET_RUNTIME_ROOT (medusa/model/settings.py): the generated
# Compose files and the WireGuard symlink both reference secrets here. Shared by
# the secrets and wireguard_gateway roles, so it lives here, not in a role.
medusa_secret_runtime_root: /run/medusa-secrets
medusa_uv_cache_dir: /tmp/medusa-uv-cache

# Keep deployed Medusa-managed files under a dedicated deployment owner. The
# manual stacks directory is intentionally left alone; generated Compose stacks
# are deployed beneath medusa-stacks.
medusa_home_root: /home/medusa
medusa_deploy_root: "{{ medusa_home_root }}/medusa"
medusa_deploy_group: medusa
medusa_deploy_owner: medusa
medusa_managed_stacks_root: "{{ medusa_home_root }}/medusa-stacks"

# Deployment destinations. These are intentionally centralized because homelab
# paths tend to be host-specific.
medusa_coredns_config_dir: "/etc/coredns"
medusa_traefik_dynamic_dir: "{{ medusa_managed_stacks_root }}/infrastructure/traefik/dynamic"
medusa_homepage_config_dir: "{{ medusa_managed_stacks_root }}/infrastructure/homepage/config"
medusa_monitoring_config_dir: "{{ medusa_deploy_root }}/monitoring"
medusa_compose_stacks_root: "{{ medusa_managed_stacks_root }}"

# Service names on the target hosts.
medusa_coredns_service_name: coredns
medusa_coredns_restart: true
medusa_traefik_service_name: traefik

# Compose lifecycle is deployment behavior, not Medusa generation behavior.
# Use deploy.yml with this false to only copy files, or compose-up/stop.yml
# to intentionally change runtime state.
medusa_compose_apply: false
medusa_compose_state: present

# Compose targeting (T-082). Empty = fleet-wide / whole-stack default; the
# medusactl compose verbs set these per invocation. medusa_compose_target is a
# stack path under generated/compose/ (e.g. 'media/immich'); medusa_compose_service
# narrows to one service; medusa_compose_pull ('always') forces image re-pulls.
medusa_compose_target: ""
medusa_compose_service: ""
medusa_compose_pull: ""
