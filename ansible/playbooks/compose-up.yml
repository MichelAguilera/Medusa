---
- name: Verify generated artifacts are current
  hosts: medusa_control
  gather_facts: false
  roles:
    - preflight

- name: Install the Docker engine on managed Docker hosts
  hosts: docker_hosts
  gather_facts: false
  roles:
    - docker_engine

- name: Prepare managed Docker stack root
  hosts: docker_hosts
  gather_facts: false
  roles:
    - deploy_root

- name: Deploy managed secrets
  hosts: docker_hosts
  gather_facts: false
  roles:
    - secrets

- name: Copy and start Compose stacks
  hosts: docker_hosts
  gather_facts: false
  vars:
    medusa_compose_apply: true
    medusa_compose_state: present
  roles:
    - compose
