---
# Install + enable the Docker engine on docker_hosts (Tier-2 dependency,
# Medusa-owned). The whole install is gated on Docker being ABSENT: a limited
# target that already runs Docker -- possibly rootless, via snap, or a
# hand-built setup -- is left completely untouched. "Install if absent", never
# "impose". On a fresh managed VM this turns `docker: command not found` into a
# running engine with the deploy user able to drive Compose.

- name: Check whether the Docker engine is already present
  ansible.builtin.command:
    cmd: docker --version
  register: medusa_docker_probe
  changed_when: false
  failed_when: false

- name: Provision the Docker engine (only when absent)
  when: medusa_docker_probe.rc != 0
  become: true
  block:
    - name: Ensure apt prerequisites for the Docker repo are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure the apt keyrings directory exists
      ansible.builtin.file:
        path: "{{ medusa_docker_keyring_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the Docker apt signing key
      ansible.builtin.get_url:
        url: "{{ medusa_docker_gpg_url }}"
        dest: "{{ medusa_docker_keyring_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Detect the host architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: medusa_docker_arch
      changed_when: false

    - name: Detect the Debian release codename
      ansible.builtin.shell:
        cmd: . /etc/os-release && printf '%s' "${VERSION_CODENAME}"
      register: medusa_docker_codename
      changed_when: false

    - name: Add the Docker apt repository
      ansible.builtin.copy:
        dest: "{{ medusa_docker_repo_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [arch={{ medusa_docker_arch.stdout }} signed-by={{ medusa_docker_keyring_path }}] https://download.docker.com/linux/debian {{ medusa_docker_codename.stdout }} stable

    - name: Install the Docker engine and Compose plugin
      ansible.builtin.apt:
        name: "{{ medusa_docker_packages }}"
        state: present
        update_cache: true

    - name: Enable and start the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add the deploy + connection users to the docker group
      # Only meaningful once we created the group via the install above, so it
      # lives inside the absent-only block -- a limited host's group model is
      # not touched.
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ medusa_docker_group }}"
        append: true
      loop: "{{ medusa_docker_group_members | unique }}"

    - name: Reset connection so docker group membership is active
      ansible.builtin.meta: reset_connection
