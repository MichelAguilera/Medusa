---
# Tier-2 provisioning (see architecture-decisions, "Provisioning boundary:
# two dependency tiers"). The Docker engine is Medusa's responsibility to
# install + configure on docker_hosts. Installed ONLY when absent, so a
# limited target already running Docker its own way is never touched.

# Debian official repository (Medusa targets Debian; see bootstrap.md).
medusa_docker_gpg_url: https://download.docker.com/linux/debian/gpg
medusa_docker_keyring_path: /etc/apt/keyrings/docker.asc
medusa_docker_repo_path: /etc/apt/sources.list.d/docker.list

medusa_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# docker-group membership is root-equivalent, so ONLY the medusa
# service-runtime user (medusa_deploy_owner) is added -- it runs Compose. The
# ansible deployment user is kept out and escalates per task via sudo. See
# architecture-decisions, "Service runtime identity".
medusa_docker_group: docker
