---
# Written under the medusa-owned stacks tree via sudo; the medusa
# service-runtime user owns it (see architecture-decisions, "Service runtime
# identity").
- name: Ensure Traefik dynamic config directory exists
  ansible.builtin.file:
    path: "{{ medusa_traefik_dynamic_dir }}"
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2775"
  become: true

- name: Deploy Traefik dynamic config
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/traefik/{{ inventory_hostname }}/dynamic.yaml"
    dest: "{{ medusa_traefik_dynamic_dir }}/medusa-dynamic.yaml"
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
