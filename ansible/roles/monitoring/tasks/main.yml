---
- name: Ensure monitoring config directory exists
  ansible.builtin.file:
    path: "{{ medusa_monitoring_config_dir }}"
    state: directory
    mode: "2775"

- name: Deploy Prometheus target config
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/monitoring/{{ inventory_hostname }}/prometheus-targets.yaml"
    dest: "{{ medusa_monitoring_config_dir }}/prometheus-targets.yaml"
    mode: "0664"
