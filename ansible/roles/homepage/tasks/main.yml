---
# Written under the medusa-owned stacks tree via sudo; the medusa
# service-runtime user owns it (see architecture-decisions, "Service runtime
# identity").
- name: Ensure Homepage config directory exists
  ansible.builtin.file:
    path: "{{ medusa_homepage_config_dir }}"
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2775"
  become: true

- name: Deploy Homepage services config
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/homepage/{{ inventory_hostname }}/services.yaml"
    dest: "{{ medusa_homepage_config_dir }}/services.yaml"
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
