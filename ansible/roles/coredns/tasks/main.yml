---
# T-056: guarded CoreDNS config apply.
#
# CoreDNS at the canonical DNS IP is the LIVE resolver for the whole LAN. A
# broken Corefile/zone deployed here takes DNS down fleet-wide, and the old
# config would already be overwritten. So this role mirrors the T-055 cutover
# philosophy: back up the current config, apply, restart, HEALTH-CHECK, and
# AUTO-RESTORE the backup on failure. CoreDNS deployment uses explicit
# `sudo -n` (see docs/deployment.md Operational Notes), not `become`.

- name: Ensure CoreDNS config directory exists
  ansible.builtin.command:
    cmd: "sudo -n install -d -m 0755 {{ medusa_coredns_config_dir }}"
  changed_when: false

- name: Probe existing CoreDNS config (for backup/restore)
  ansible.builtin.stat:
    path: "{{ medusa_coredns_config_dir }}/{{ item }}"
  loop:
    - Corefile
    - lan.hosts
  register: medusa_coredns_existing

- name: Back up current CoreDNS config (last-known-good)
  ansible.builtin.command:
    cmd: >-
      sudo -n cp -a
      {{ medusa_coredns_config_dir }}/{{ item.item }}
      {{ medusa_coredns_config_dir }}/{{ item.item }}.medusa-bak
  loop: "{{ medusa_coredns_existing.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  changed_when: true

- name: Detect dig for the resolve health check
  ansible.builtin.command:
    cmd: command -v dig
  changed_when: false
  failed_when: false
  register: medusa_coredns_dig

- name: Deploy CoreDNS config under guard
  block:
    - name: Stage CoreDNS Corefile
      ansible.builtin.copy:
        src: "{{ medusa_generated_dir }}/coredns/Corefile"
        dest: /tmp/medusa-coredns-Corefile
        mode: "0644"

    - name: Stage CoreDNS LAN hosts file
      ansible.builtin.copy:
        src: "{{ medusa_generated_dir }}/coredns/lan.hosts"
        dest: /tmp/medusa-coredns-lan.hosts
        mode: "0644"

    - name: Deploy CoreDNS Corefile
      ansible.builtin.command:
        cmd: >-
          sudo -n install -m 0644 /tmp/medusa-coredns-Corefile
          {{ medusa_coredns_config_dir }}/Corefile
      changed_when: true

    - name: Deploy CoreDNS LAN hosts file
      ansible.builtin.command:
        cmd: >-
          sudo -n install -m 0644 /tmp/medusa-coredns-lan.hosts
          {{ medusa_coredns_config_dir }}/lan.hosts
      changed_when: true

    - name: Restart CoreDNS
      ansible.builtin.command:
        cmd: "sudo -n systemctl restart {{ medusa_coredns_service_name }}"
      changed_when: true
      when: medusa_coredns_restart | bool

    - name: Health-check - CoreDNS service is active
      ansible.builtin.command:
        cmd: "systemctl is-active {{ medusa_coredns_service_name }}"
      changed_when: false
      register: medusa_coredns_active
      failed_when: medusa_coredns_active.stdout != "active"
      when: medusa_coredns_restart | bool

    - name: Health-check - CoreDNS answers queries (liveness + optional name)
      ansible.builtin.command:
        cmd: >-
          dig +time=2 +tries=1 @{{ medusa_coredns_healthcheck_server }}
          {{ medusa_coredns_healthcheck_name | default('liveness.medusa.invalid', true) }}
          +short
      changed_when: false
      register: medusa_coredns_resolve
      # rc 0 means CoreDNS responded at all (even NXDOMAIN). A dead resolver
      # times out -> non-zero -> triggers the rescue/restore.
      failed_when: medusa_coredns_resolve.rc != 0
      when: medusa_coredns_dig.rc == 0

    - name: Health-check - resolved name matches the expected address
      ansible.builtin.assert:
        that:
          - medusa_coredns_healthcheck_expect in medusa_coredns_resolve.stdout_lines
        fail_msg: >-
          CoreDNS resolved {{ medusa_coredns_healthcheck_name }} to
          {{ medusa_coredns_resolve.stdout_lines | default([]) }}, expected
          {{ medusa_coredns_healthcheck_expect }}. Restoring previous config.
      when:
        - medusa_coredns_dig.rc == 0
        - medusa_coredns_healthcheck_name | length > 0
        - medusa_coredns_healthcheck_expect | length > 0

  rescue:
    - name: Restore CoreDNS config from backup
      ansible.builtin.command:
        cmd: >-
          sudo -n cp -a
          {{ medusa_coredns_config_dir }}/{{ item.item }}.medusa-bak
          {{ medusa_coredns_config_dir }}/{{ item.item }}
      loop: "{{ medusa_coredns_existing.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      changed_when: true

    - name: Remove freshly-deployed config when there was no backup
      ansible.builtin.command:
        cmd: "sudo -n rm -f {{ medusa_coredns_config_dir }}/{{ item.item }}"
      loop: "{{ medusa_coredns_existing.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists
      changed_when: true

    - name: Restart CoreDNS after restore
      ansible.builtin.command:
        cmd: "sudo -n systemctl restart {{ medusa_coredns_service_name }}"
      changed_when: true
      when: medusa_coredns_restart | bool
      failed_when: false

    - name: Fail - CoreDNS config rejected, previous config restored
      ansible.builtin.fail:
        msg: >-
          CoreDNS health check failed on {{ inventory_hostname }}; the
          previously deployed config was restored and CoreDNS restarted.
          DNS is not left broken. Inspect the rendered Corefile/lan.hosts
          before retrying.

  always:
    - name: Remove staged CoreDNS files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/medusa-coredns-Corefile
        - /tmp/medusa-coredns-lan.hosts
