---
- name: Check exportfs is available
  ansible.builtin.command:
    cmd: /usr/sbin/exportfs -v
  become: true
  changed_when: false
  failed_when: false
  register: medusa_exportfs

- name: Fail when exportfs is missing
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is listed as a Medusa NFS export server, but
      /usr/sbin/exportfs is not available via sudo. Install or configure the
      host's NFS server stack first; Medusa does not blindly install
      nfs-kernel-server.
  when: medusa_exportfs.rc != 0

- name: Ensure exports.d directory exists
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: "0755"
  become: true

- name: Load generated storage manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/storage-manifest.yaml"
    name: medusa_storage_manifest

- name: Resolve managed exports for this server
  ansible.builtin.set_fact:
    medusa_server_exports: >-
      {{ (medusa_storage_manifest.servers | default({}))[inventory_hostname]
         | default([]) }}

- name: Ensure ZFS datasets backing exports exist
  community.general.zfs:
    name: "{{ item.dataset }}"
    state: present
  become: true
  loop: "{{ medusa_server_exports | selectattr('dataset') | list }}"
  loop_control:
    label: "{{ item.dataset }}"

# Ownership comes from the manifest (T-085): the export path converges to its
# declared owner/group/mode on every run, so an sftp uid chown or a shared
# space's setgid group survives deploys instead of being clobbered back to the
# automation user.
- name: Ensure export directories exist with managed ownership
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner }}"
    group: "{{ item.1.group }}"
    mode: "{{ item.1.mode }}"
  become: true
  loop: "{{ medusa_server_exports | subelements('directories') }}"
  loop_control:
    label: "{{ item.1.path }}"

# Orphan detection (T-072): warn -- never destroy -- about datasets under the
# pool root that back no declared export. Medusa is create-only for ZFS; the
# operator decides whether any flagged dataset is truly stale.
- name: Resolve ZFS pool root for this server
  ansible.builtin.set_fact:
    medusa_zfs_root: >-
      {{ (medusa_storage_manifest.zfs_roots | default({}))[inventory_hostname]
         | default('') }}
    medusa_declared_datasets: >-
      {{ medusa_server_exports | selectattr('dataset') | map(attribute='dataset')
         | unique | list }}

- name: List first-level datasets under the pool root
  ansible.builtin.command:
    cmd: "zfs list -H -o name -d 1 -r {{ medusa_zfs_root | regex_replace('^/', '') }}"
  become: true
  changed_when: false
  failed_when: false
  register: medusa_zfs_children
  when: medusa_zfs_root | length > 0

- name: Warn about orphaned ZFS datasets backing no declared export
  ansible.builtin.debug:
    msg: >-
      WARNING: ZFS dataset {{ item }} under {{ medusa_zfs_root }} backs no
      declared Medusa export. Medusa never destroys data; run
      'zfs destroy {{ item }}' by hand only if it is truly stale.
  loop: >-
    {{ (medusa_zfs_children.stdout_lines | default([]) | select('search', '/')
        | list) | difference(medusa_declared_datasets) }}
  when: medusa_zfs_root | length > 0

- name: Deploy managed NFS exports
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/storage/exports/{{ inventory_hostname }}/medusa.exports"
    dest: /etc/exports.d/medusa.exports
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload NFS exports
