---
- name: Reload tunnel marking ruleset
  ansible.builtin.command:
    cmd: "nft -f {{ medusa_tunnel_routing_nftables_file }}"
  become: true
  changed_when: true

- name: Reapply tunnel routes
  ansible.builtin.systemd_service:
    name: medusa-tunnel-routes.service
    state: restarted
    daemon_reload: true
  become: true
