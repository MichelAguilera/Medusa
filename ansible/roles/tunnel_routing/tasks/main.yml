---
# T-066: per-Docker-host tunnel routing.
#
# Creates the external `medusa-tunnel` Docker network and installs split policy
# routing for tunneled containers: traffic from the tunnel subnet is marked in
# nftables PREROUTING, then policy-routed — LAN-bound traffic stays direct,
# everything else goes out the WireGuard gateway behind a fail-closed default.
# Applied only to hosts that actually run a tunneled service
# (tunnel_routing_hosts).

- name: Load generated egress manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/egress-manifest.yaml"
    name: medusa_egress
  delegate_to: localhost
  become: false
  run_once: true

- name: Create the external tunnel Docker network
  community.docker.docker_network:
    name: "{{ medusa_egress.network_name }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ medusa_egress.tunnel_subnet }}"
    state: present
  become: true

- name: Gather minimal facts for package-manager dispatch
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Ensure nftables and iproute2 are installed
  ansible.builtin.package:
    name: "{{ medusa_tunnel_routing_packages }}"
    state: present
  become: true

# Asymmetric policy routing needs loose reverse-path filtering, or replies
# arriving on a different path than the route table expects get dropped.
- name: Set loose reverse-path filtering
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "2"
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter

# --- packet marking (nftables) ---
- name: Ensure the nftables ruleset directory exists
  ansible.builtin.file:
    path: "{{ medusa_tunnel_routing_nftables_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the tunnel marking ruleset
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/egress/tunnel-routing.nft"
    dest: "{{ medusa_tunnel_routing_nftables_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload tunnel marking ruleset

# Loaded via our own oneshot, NOT the distro nftables.service. On a Docker host
# nftables.service runs `flush ruleset`, which would wipe Docker's own
# iptables-nft rules and break container networking. Our ruleset only adds its
# own table, so `nft -f` is surgical.
- name: Install the tunnel marking loader service
  ansible.builtin.template:
    src: medusa-nft-loader.service.j2
    dest: /etc/systemd/system/medusa-tunnel-firewall.service
    owner: root
    group: root
    mode: "0644"
  vars:
    medusa_nft_description: Medusa tunnel packet marking
    medusa_nft_file: "{{ medusa_tunnel_routing_nftables_file }}"
  become: true
  notify: Reload tunnel marking ruleset

- name: Enable and start the tunnel marking loader
  ansible.builtin.systemd_service:
    name: medusa-tunnel-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  become: true

# --- policy routing (ip rule / ip route via a oneshot service) ---
- name: Deploy the tunnel routing script
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/egress/tunnel-routes.sh"
    dest: /usr/local/sbin/medusa-tunnel-routes.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Reapply tunnel routes

- name: Install the tunnel routing service
  ansible.builtin.copy:
    src: medusa-tunnel-routes.service
    dest: /etc/systemd/system/medusa-tunnel-routes.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reapply tunnel routes

- name: Enable and start the tunnel routing service
  ansible.builtin.systemd_service:
    name: medusa-tunnel-routes.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
