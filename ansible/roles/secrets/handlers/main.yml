---
# Re-run the oneshot decrypt unit when the script or unit changes. RemainAfterExit
# means `restarted` re-executes ExecStart, re-decrypting to tmpfs in place.
- name: Re-decrypt managed secrets
  ansible.builtin.systemd_service:
    name: "{{ medusa_secrets_unit_name }}.service"
    state: restarted
    daemon_reload: true
  become: true
