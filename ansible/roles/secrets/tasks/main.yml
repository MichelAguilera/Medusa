---
- name: Load generated secret manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/secrets-manifest.yaml"
    name: medusa_secret_manifest
  delegate_to: localhost
  become: false

- name: Select secrets for this host
  ansible.builtin.set_fact:
    medusa_host_secret_entries: >-
      {{ medusa_secret_manifest.secrets
      | selectattr('host', 'equalto', inventory_hostname)
      | list }}

- name: Ensure managed secret destination directories exist
  # Owned by the medusa service-runtime user: it runs Compose and must read
  # these secrets; ansible writes them on its behalf via sudo. See
  # architecture-decisions, "Service runtime identity".
  ansible.builtin.file:
    path: "{{ medusa_compose_stacks_root }}/{{ item.destination | dirname }}"
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2770"
  become: true
  loop: "{{ medusa_host_secret_entries }}"
  loop_control:
    label: "{{ item.destination }}"

- name: Decrypt managed secrets on controller
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - --extract
      - '["value"]'
      - "{{ medusa_secrets_root }}/{{ item.source }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: medusa_decrypted_secrets
  loop: "{{ medusa_host_secret_entries }}"
  loop_control:
    label: "{{ item.source }}"

- name: Deploy file-backed managed secrets
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ medusa_compose_stacks_root }}/{{ item.item.destination }}"
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0600"
  become: true
  loop: "{{ medusa_decrypted_secrets.results }}"
  loop_control:
    label: "{{ item.item.destination }}"
  when: item.item.mode == "file"

- name: Deploy environment managed secrets
  ansible.builtin.lineinfile:
    path: "{{ medusa_compose_stacks_root }}/{{ item.item.destination }}"
    regexp: "^{{ item.item.setting }}="
    line: "{{ item.item.setting }}={{ item.stdout }}"
    create: true
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0600"
  become: true
  loop: "{{ medusa_decrypted_secrets.results }}"
  loop_control:
    label: "{{ item.item.destination }}:{{ item.item.setting }}"
  when: item.item.mode == "env"
