---
# Host-side secret decryption (T-080). The controller ships ciphertext only;
# each Debian host decrypts its own secrets locally with its ssh host key (via
# ssh-to-age) into tmpfs at boot. The controller holds no decryption key, so a
# compromised controller cannot read any secret at rest. NixOS hosts do the same
# via sops-nix and are excluded from this role by the platform fork (T-073), so
# this role never branches on platform.

- name: Load generated secret manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/secrets-manifest.yaml"
    name: medusa_secret_manifest
  delegate_to: localhost
  become: false

- name: Select secrets for this host
  ansible.builtin.set_fact:
    medusa_host_secret_entries: >-
      {{ medusa_secret_manifest.secrets
      | selectattr('host', 'equalto', inventory_hostname)
      | list }}

- name: Manage host-side secret decryption
  when: medusa_host_secret_entries | length > 0
  block:
    - name: Install the host-side decryption tools (sops, ssh-to-age)
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ medusa_secrets_bin_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      loop:
        - { name: sops, url: "{{ medusa_sops_url }}" }
        - { name: ssh-to-age, url: "{{ medusa_ssh_to_age_url }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure the encrypted-secret staging directories exist
      # Root-owned: the decrypt unit runs as root (it reads the root-only ssh
      # host key), so the staged ciphertext need not be readable by any service
      # user. This keeps the role working on a dedicated gateway host that has no
      # medusa user. Ciphertext is safe at rest; only the decrypted output (in
      # tmpfs, owned per-secret) is sensitive.
      ansible.builtin.file:
        path: "{{ (medusa_secrets_enc_dir ~ '/' ~ item.source) | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      become: true
      loop: "{{ medusa_host_secret_entries }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Ship the encrypted secret files (ciphertext only)
      ansible.builtin.copy:
        src: "{{ medusa_secrets_root }}/{{ item.source }}"
        dest: "{{ medusa_secrets_enc_dir }}/{{ item.source }}"
        owner: root
        group: root
        mode: "0640"
      become: true
      loop: "{{ medusa_host_secret_entries }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Ensure the decrypt-script directory exists
      ansible.builtin.file:
        path: "{{ medusa_secrets_script_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the host decrypt script
      ansible.builtin.template:
        src: medusa-decrypt-secrets.sh.j2
        dest: "{{ medusa_secrets_script_path }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      notify: Re-decrypt managed secrets

    - name: Install the secret-decryption systemd unit
      ansible.builtin.template:
        src: medusa-secrets.service.j2
        dest: "/etc/systemd/system/{{ medusa_secrets_unit_name }}.service"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: Re-decrypt managed secrets

    - name: Enable the secret-decryption unit
      ansible.builtin.systemd_service:
        name: "{{ medusa_secrets_unit_name }}.service"
        enabled: true
        daemon_reload: true
      become: true

    # Run it now so the freshly-shipped secrets are present for the compose role
    # later in this same play, not only after the next reboot. The handler covers
    # changes; this guarantees first-run materialization.
    - name: Decrypt secrets to tmpfs now
      ansible.builtin.systemd_service:
        name: "{{ medusa_secrets_unit_name }}.service"
        state: started
      become: true
