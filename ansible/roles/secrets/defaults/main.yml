---
# Host-side secret decryption (T-080). The controller ships ciphertext only;
# each host decrypts its own secrets locally with its ssh host key (via
# ssh-to-age) into tmpfs at boot. The controller holds no decryption key.

# medusa_secret_runtime_root (the tmpfs decrypt root) is defined in
# group_vars/all.yml -- it is shared with the wireguard_gateway role and must
# match Medusa's SECRET_RUNTIME_ROOT, so it is not a per-role default.

# Persistent (on-disk) staging dir for the ENCRYPTED source files shipped from
# the controller. Ciphertext is safe at rest; only the decrypted output (in
# tmpfs) is sensitive.
medusa_secrets_enc_dir: "{{ medusa_deploy_root }}/secrets-enc"

# The host's ssh host key, reused as its age identity (ssh-to-age). ed25519 is
# the sops-nix idiom and what the host's age_recipient in inventory is derived
# from. Root-readable only; the decrypt unit runs as root to read it.
medusa_ssh_host_key: /etc/ssh/ssh_host_ed25519_key

# Pinned single-binary tools fetched to /usr/local/bin. Pinned (not apt) so the
# version is identical across the fleet -- Debian has no packaged ssh-to-age and
# its sops package lags. sops embeds age decryption (SOPS_AGE_KEY), so a
# standalone `age` binary is not needed. Bump deliberately.
medusa_secrets_bin_dir: /usr/local/bin
medusa_sops_version: "3.9.4"
medusa_ssh_to_age_version: "1.3.0"
medusa_sops_url: "https://github.com/getsops/sops/releases/download/v{{ medusa_sops_version }}/sops-v{{ medusa_sops_version }}.linux.amd64"
# Note the v-prefix on the tag: Mic92/ssh-to-age release tags are vX.Y.Z.
medusa_ssh_to_age_url: "https://github.com/Mic92/ssh-to-age/releases/download/v{{ medusa_ssh_to_age_version }}/ssh-to-age.linux-amd64"

# Names of the installed decrypt unit + script.
medusa_secrets_unit_name: medusa-secrets
medusa_secrets_script_path: "{{ medusa_deploy_root }}/bin/medusa-decrypt-secrets"
