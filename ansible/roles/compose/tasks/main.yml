---
- name: Find generated Compose stack files
  ansible.builtin.find:
    paths: "{{ medusa_generated_dir }}/compose"
    patterns: docker-compose.yml
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: medusa_compose_files

# Per-host stack scoping (T-087): generated/compose/ carries EVERY platform's
# stacks -- compose is the platform-neutral container layer, and NixOS hosts'
# stacks are delivered through the flake instead of this role. Keep only the
# stacks the manifest assigns to this host.
- name: Load the stack->host manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/compose-stacks.yaml"
    name: medusa_stack_manifest
  delegate_to: localhost
  become: false
  run_once: true

- name: Compute this host's stack path pattern
  ansible.builtin.set_fact:
    medusa_host_stack_pattern: >-
      /compose/({{ medusa_stack_manifest.stacks | default([])
         | selectattr('host', 'equalto', inventory_hostname)
         | map(attribute='stack') | map('regex_escape') | join('|') }})/

- name: Narrow stack files to this host
  ansible.builtin.set_fact:
    medusa_compose_files: >-
      {{ medusa_compose_files | combine({'files':
         medusa_compose_files.files
         | selectattr('path', 'search', medusa_host_stack_pattern ~ 'docker-compose.yml$')
         | list }) }}

# Stack targeting (T-082): when an operator scopes the run to one stack
# (`medusactl compose <verb> <stack>`), narrow the stack file list to the
# matching stack so every downstream loop — staging, externals, apply — acts on
# that stack alone. Stack identity is its path under generated/compose/ (e.g.
# 'gitea', 'media/immich'); an empty target keeps the fleet-wide default.
- name: Narrow stack files to the targeted stack
  ansible.builtin.set_fact:
    medusa_compose_files: >-
      {{ medusa_compose_files | combine({'files':
         medusa_compose_files.files
         | selectattr('path', 'search', '/compose/' ~ (medusa_compose_target | regex_escape) ~ '/docker-compose.yml$')
         | list }) }}
  when: medusa_compose_target | default('') | length > 0

- name: Fail when the targeted stack matched no rendered stack
  ansible.builtin.fail:
    msg: >-
      compose target '{{ medusa_compose_target }}' matched no rendered stack on
      {{ inventory_hostname }}. Run 'medusactl compose list' for valid names.
  when:
    - medusa_compose_target | default('') | length > 0
    - medusa_compose_files.files | length == 0

# The whole stacks tree is owned by the medusa service-runtime user (it runs
# Compose); ansible writes it via sudo. See architecture-decisions, "Service
# runtime identity".
- name: Ensure Compose stack directories exist
  ansible.builtin.file:
    path: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2775"
  become: true
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Deploy Compose stack files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}/docker-compose.yml
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Find generated managed environment files
  ansible.builtin.find:
    paths: "{{ medusa_generated_dir }}/compose"
    patterns: "*.env"
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: medusa_compose_env_files

# Mirror the per-host stack scoping (T-087) for env files.
- name: Narrow env files to this host
  ansible.builtin.set_fact:
    medusa_compose_env_files: >-
      {{ medusa_compose_env_files | combine({'files':
         medusa_compose_env_files.files
         | selectattr('path', 'search', medusa_host_stack_pattern)
         | list }) }}

# Mirror the stack-file narrowing (above) for env files so a targeted run only
# stages its own stack's env files.
- name: Narrow env files to the targeted stack
  ansible.builtin.set_fact:
    medusa_compose_env_files: >-
      {{ medusa_compose_env_files | combine({'files':
         medusa_compose_env_files.files
         | selectattr('path', 'search', '/compose/' ~ (medusa_compose_target | regex_escape) ~ '/')
         | list }) }}
  when: medusa_compose_target | default('') | length > 0

- name: Ensure generated managed environment directories exist
  # 2770 (not 2775): an env dir can also hold secret env files (the secrets
  # role writes the same <stack>/env path at 2770); matching modes avoids a
  # per-run flip and keeps env contents off "other".
  ansible.builtin.file:
    path: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^' ~ medusa_generated_dir ~ '/compose/(.*)/env/[^/]+$', '\1/env') }}
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2770"
  become: true
  loop: "{{ medusa_compose_env_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Deploy generated managed environment files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^' ~ medusa_generated_dir ~ '/compose/(.*)$', '\1') }}
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
  loop: "{{ medusa_compose_env_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

# `docker compose up` does NOT create resources declared `external: true`
# (shared networks like the Traefik 'proxy', and named volumes the operator
# marks external such as 'portainer_data'); it errors "external <kind> ... not
# found". Medusa must create them first. Rather than hardcode names, DISCOVER
# them from the rendered compose files so any operator-declared external
# resource is handled.
- name: Read rendered compose files to discover external resources
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  delegate_to: localhost
  become: false
  register: medusa_compose_parsed
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"
  when: medusa_compose_apply | bool

- name: Compute external volumes and networks declared across stacks
  ansible.builtin.set_fact:
    medusa_external_volumes: >-
      {{ medusa_compose_parsed.results | map(attribute='content')
         | map('b64decode') | map('from_yaml')
         | map(attribute='volumes', default={}) | map('dict2items')
         | sum(start=[]) | selectattr('value', 'mapping')
         | selectattr('value.external', 'defined') | selectattr('value.external')
         | map(attribute='key') | list | unique }}
    medusa_external_networks: >-
      {{ (medusa_compose_external_networks
          + (medusa_compose_parsed.results | map(attribute='content')
             | map('b64decode') | map('from_yaml')
             | map(attribute='networks', default={}) | map('dict2items')
             | sum(start=[]) | selectattr('value', 'mapping')
             | selectattr('value.external', 'defined') | selectattr('value.external')
             | map(attribute='key') | list)) | unique }}
  when: medusa_compose_apply | bool

- name: Ensure external Docker volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  become: true
  become_user: "{{ medusa_deploy_owner }}"
  loop: "{{ medusa_external_volumes }}"
  when: medusa_compose_apply | bool

- name: Ensure external Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  become: true
  become_user: "{{ medusa_deploy_owner }}"
  loop: "{{ medusa_external_networks }}"
  when: medusa_compose_apply | bool

# Create + own each service's bind-mount data directory to the UID:GID the
# container runs as (services declare `data_owner`), BEFORE compose up. Docker
# otherwise auto-creates a missing bind source as root:root, and a non-root
# container (e.g. seerr as 1000, www-data as 33) then cannot write its volume
# -> EACCES / crash-loop -> 502. Runs as root (chown to an arbitrary UID needs
# it), NOT as medusa; `recurse: true` also fixes already-root-owned dirs from a
# prior failed run. See T-065.
- name: Load managed compose data-dir manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/compose-data-dirs.yaml"
    name: medusa_data_dir_manifest
  delegate_to: localhost
  become: false
  run_once: true
  when: medusa_compose_apply | bool

- name: Create and own service bind-mount data directories
  ansible.builtin.file:
    path: "{{ medusa_compose_stacks_root }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    recurse: true
  become: true
  loop: >-
    {{ (medusa_data_dir_manifest.data_dirs | default([]))
       | selectattr('host', 'equalto', inventory_hostname) | list }}
  loop_control:
    label: "{{ item.path }} -> {{ item.owner }}:{{ item.group }}"
  when:
    - medusa_compose_apply | bool
    - >-
      medusa_compose_target | default('') | length == 0
      or (item.path ~ '/') is match('^' ~ (medusa_compose_target | regex_escape) ~ '/')

- name: Apply Compose stack state
  # Runs as the medusa service-runtime user, NOT the ansible deployment user:
  # medusa owns the stacks tree and is in the docker group, so it talks to the
  # docker socket without sudo. ansible never gets docker-group (root-equiv)
  # access. See architecture-decisions, "Service runtime identity".
  community.docker.docker_compose_v2:
    project_src: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}
    state: "{{ medusa_compose_state }}"
    # Service targeting (T-082): scope the action to one service within the
    # stack when set; omit to act on the whole stack (the default).
    services: "{{ [medusa_compose_service] if (medusa_compose_service | default('')) else omit }}"
    # Image pull policy (T-082, folds T-068): omit by default to keep the
    # module's behavior; `--pull` / the `pull` verb set this to 'always' so a
    # moved 'latest' is re-pulled and changed containers recreated.
    pull: "{{ medusa_compose_pull if (medusa_compose_pull | default('')) else omit }}"
  become: true
  become_user: "{{ medusa_deploy_owner }}"
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"
  when: medusa_compose_apply | bool
