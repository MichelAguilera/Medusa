---
- name: Find generated Compose stack files
  ansible.builtin.find:
    paths: "{{ medusa_generated_dir }}/compose"
    patterns: docker-compose.yml
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: medusa_compose_files

# The whole stacks tree is owned by the medusa service-runtime user (it runs
# Compose); ansible writes it via sudo. See architecture-decisions, "Service
# runtime identity".
- name: Ensure Compose stack directories exist
  ansible.builtin.file:
    path: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2775"
  become: true
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Deploy Compose stack files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}/docker-compose.yml
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Find generated managed environment files
  ansible.builtin.find:
    paths: "{{ medusa_generated_dir }}/compose"
    patterns: "*.env"
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: medusa_compose_env_files

- name: Ensure generated managed environment directories exist
  # 2770 (not 2775): an env dir can also hold secret env files (the secrets
  # role writes the same <stack>/env path at 2770); matching modes avoids a
  # per-run flip and keeps env contents off "other".
  ansible.builtin.file:
    path: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^' ~ medusa_generated_dir ~ '/compose/(.*)/env/[^/]+$', '\1/env') }}
    state: directory
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "2770"
  become: true
  loop: "{{ medusa_compose_env_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Deploy generated managed environment files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^' ~ medusa_generated_dir ~ '/compose/(.*)$', '\1') }}
    owner: "{{ medusa_deploy_owner }}"
    group: "{{ medusa_deploy_group }}"
    mode: "0664"
  become: true
  loop: "{{ medusa_compose_env_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"

- name: Apply Compose stack state
  # Runs as the medusa service-runtime user, NOT the ansible deployment user:
  # medusa owns the stacks tree and is in the docker group, so it talks to the
  # docker socket without sudo. ansible never gets docker-group (root-equiv)
  # access. See architecture-decisions, "Service runtime identity".
  community.docker.docker_compose_v2:
    project_src: >-
      {{ medusa_compose_stacks_root }}/{{ item.path
      | regex_replace('^.*/compose/(.*)/docker-compose.yml$', '\1') }}
    state: "{{ medusa_compose_state }}"
  become: true
  become_user: "{{ medusa_deploy_owner }}"
  loop: "{{ medusa_compose_files.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ medusa_generated_dir ~ '/compose/', '') }}"
  when: medusa_compose_apply | bool
