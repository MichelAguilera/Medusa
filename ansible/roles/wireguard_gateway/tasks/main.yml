---
# T-066: shared WireGuard egress gateway.
#
# Brings up a WireGuard interface, NATs forwarded traffic out of it behind a
# fail-closed kill-switch (nftables, drop policy), and runs a split-DNS
# resolver so tunneled clients resolve managed zones via CoreDNS and everything
# else through the tunnel (no DNS leak). The WireGuard config itself is an
# operator secret delivered from SOPS; Medusa never renders or stores it.
#
# This role assumes a DEDICATED gateway host. The nftables forward chain uses a
# drop policy; do not co-locate this with a Docker host or another router whose
# forwarded traffic must survive.

- name: Load generated egress manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/egress-manifest.yaml"
    name: medusa_egress
  delegate_to: localhost
  become: false
  run_once: true

- name: Gather minimal facts for package-manager dispatch
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Refresh apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure WireGuard, resolver, and firewall packages are installed
  ansible.builtin.package:
    name: "{{ medusa_egress_packages }}"
    state: present
  become: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true

# --- WireGuard interface (operator secret, decrypted host-side via T-080) ---
# The secret is NOT decrypted on the controller anymore. The `secrets` role runs
# first in this play and its medusa-secrets unit decrypts the WireGuard config to
# tmpfs using THIS host's ssh host key (one trust model, T-080). wg-quick reads
# /etc/wireguard/<iface>.conf, so we point that at the decrypted file with a
# symlink and make wg-quick wait for the decrypt unit. The plaintext never
# touches persistent disk or the controller.
- name: Ensure the WireGuard config directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Point wg-quick at the host-decrypted WireGuard config (tmpfs)
  ansible.builtin.file:
    src: "{{ medusa_secret_runtime_root }}/{{ medusa_egress.gateway }}/wireguard/{{ medusa_egress.interface }}.conf"
    dest: "/etc/wireguard/{{ medusa_egress.interface }}.conf"
    state: link
    force: true
    follow: false
  become: true
  notify: Restart WireGuard interface

- name: Ensure the wg-quick drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/wg-quick@{{ medusa_egress.interface }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Order wg-quick after the secret-decryption unit
  # Boot ordering: the tmpfs config does not exist until medusa-secrets.service
  # has run, so wg-quick must require and follow it.
  ansible.builtin.copy:
    dest: "/etc/systemd/system/wg-quick@{{ medusa_egress.interface }}.service.d/medusa-secrets.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=medusa-secrets.service
      Requires=medusa-secrets.service
  become: true
  notify: Restart WireGuard interface

- name: Enable and start the WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ medusa_egress.interface }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

# --- NAT + fail-closed kill-switch (nftables) ---
# Loaded via our own oneshot, NOT the distro nftables.service: the latter runs
# `flush ruleset` (would wipe co-resident docker/firewall rules) and ships
# mount-namespace hardening that fails in a container (226/NAMESPACE). Our
# ruleset is self-contained (add/delete/own-table), so `nft -f` adds only our
# table and touches nothing else.
- name: Ensure the nftables ruleset directory exists
  ansible.builtin.file:
    path: "{{ medusa_egress_nftables_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the egress nftables ruleset
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/egress/{{ medusa_egress.gateway }}/nftables.conf"
    dest: "{{ medusa_egress_nftables_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nftables ruleset

- name: Install the egress firewall loader service
  ansible.builtin.template:
    src: medusa-nft-loader.service.j2
    dest: /etc/systemd/system/medusa-egress-firewall.service
    owner: root
    group: root
    mode: "0644"
  vars:
    medusa_nft_description: Medusa egress NAT + kill-switch
    medusa_nft_file: "{{ medusa_egress_nftables_file }}"
  become: true
  notify: Reload nftables ruleset

- name: Enable and start the egress firewall loader
  ansible.builtin.systemd_service:
    name: medusa-egress-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  become: true

# --- Split DNS resolver ---
- name: Deploy the split-DNS resolver config
  ansible.builtin.copy:
    src: "{{ medusa_generated_dir }}/egress/{{ medusa_egress.gateway }}/resolver.conf"
    dest: "{{ medusa_egress_resolver_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart split-DNS resolver

- name: Enable and start the split-DNS resolver
  ansible.builtin.systemd_service:
    name: "{{ medusa_egress_resolver_service }}"
    enabled: true
    state: started
  become: true
