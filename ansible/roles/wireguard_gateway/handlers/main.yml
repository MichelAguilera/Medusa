---
- name: Restart WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ medusa_egress.interface }}"
    state: restarted
  become: true

- name: Reload nftables ruleset
  ansible.builtin.command:
    cmd: "nft -f {{ medusa_egress_nftables_file }}"
  become: true
  changed_when: true

- name: Restart split-DNS resolver
  ansible.builtin.systemd_service:
    name: "{{ medusa_egress_resolver_service }}"
    state: restarted
  become: true
