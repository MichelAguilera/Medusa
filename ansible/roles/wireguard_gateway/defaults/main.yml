---
# Packages the gateway needs: WireGuard tooling, the split-DNS resolver, and
# nftables. Names are identical on Debian and Arch, so one list serves both.
medusa_egress_packages:
  - wireguard-tools
  - dnsmasq
  - nftables

# Deployment destinations on the gateway host.
medusa_egress_nftables_file: /etc/nftables.d/medusa-egress.nft
medusa_egress_resolver_file: /etc/dnsmasq.d/medusa-egress.conf
medusa_egress_resolver_service: dnsmasq
