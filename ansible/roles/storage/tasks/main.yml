---
- name: Load generated storage manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/storage-manifest.yaml"
    name: medusa_storage_manifest
  delegate_to: localhost
  become: false
  run_once: true

- name: Select mounts for this host
  ansible.builtin.set_fact:
    medusa_host_mounts: >-
      {{ medusa_storage_manifest.hosts[inventory_hostname] | default([]) }}

- name: Refresh apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: >-
    ansible_os_family == "Debian"
    and (
      medusa_host_mounts
      | selectattr('fstype', 'equalto', 'nfs')
      | list
      | length > 0
    )

- name: Ensure NFS client utilities are installed
  ansible.builtin.package:
    name: "{{ 'nfs-utils' if ansible_os_family == 'Archlinux' else 'nfs-common' }}"
    state: present
  become: true
  when: >-
    medusa_host_mounts
    | selectattr('fstype', 'equalto', 'nfs')
    | list
    | length > 0

- name: Ensure mountpoint directories exist
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Check managed NFS source host resolution
  ansible.builtin.command:
    cmd: "getent hosts {{ item.source | regex_replace(':.*$', '') }}"
  changed_when: false
  failed_when: false
  register: medusa_nfs_source_resolution
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.source | regex_replace(':.*$', '') }}"

- name: Fail when managed NFS source host does not resolve
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} cannot resolve NFS source host
      '{{ item.item.source | regex_replace(':.*$', '') }}' for mount
      {{ item.item.mountpoint }} (source {{ item.item.source }}). Fix target-side
      DNS/hosts resolution before mounting managed storage.
  loop: "{{ medusa_nfs_source_resolution.results | default([]) }}"
  loop_control:
    label: "{{ item.item.mountpoint }}"
  when: item.rc != 0

- name: Resolve source IP toward each NFS server (export-auth preflight)
  ansible.builtin.command:
    cmd: "ip -o route get {{ item.server_ip }}"
  changed_when: false
  register: medusa_nfs_route
  loop: "{{ medusa_host_mounts | selectattr('fstype', 'equalto', 'nfs') | list }}"
  loop_control:
    label: "{{ item.mountpoint }}"

# Extract the kernel-selected source IP from `ip route get` output by splitting
# on the literal " src " token -- NOT a Jinja regex. A regex pattern written as
# a Jinja string literal has its backslash escapes processed by Jinja first
# (e.g. `\b` -> backspace 0x08, `\s` left alone), so `regex_replace` silently
# fails to match, returns the WHOLE line unchanged, and the comparison below
# always reports a mismatch -- the gate fired even when the IPs matched. The
# split is escaping-proof. A missing " src " yields 'unknown', which can never
# equal the canonical IP, so an unparseable route still blocks the mount.
- name: Fail when the client's source IP is not the exported (canonical) IP
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} reaches NFS server {{ item.item.server_ip }} from
      source IP
      {{ (item.stdout.split(' src ')[1].split()[0]) if ' src ' in item.stdout
         else 'unknown' }}, but
      {{ item.item.source }} is exported only to {{ item.item.client_ip }} (this
      host's canonical IP). The mount would be denied by the server. Give this
      host its canonical IP -- a DHCP reservation for {{ item.item.client_ip }},
      or manage_network: true for a static cutover -- then redeploy.
  loop: "{{ medusa_nfs_route.results | default([]) }}"
  loop_control:
    label: "{{ item.item.mountpoint }}"
  when: >-
    ((item.stdout.split(' src ')[1].split()[0]) if ' src ' in item.stdout
     else 'unknown')
    != item.item.client_ip

- name: Mount and persist managed NFS mounts
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "{{ item.source }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }}"
    state: mounted
  become: true
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Detect installed services
  ansible.builtin.service_facts:
  when: medusa_host_mounts | length > 0

- name: Ensure docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: true
  when:
    - medusa_host_mounts | length > 0
    - "'docker.service' in (ansible_facts.services | default({}))"

- name: Make docker.service wait for managed mounts
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/medusa-mounts.conf
    mode: "0644"
    content: |
      # Generated by Medusa. Do not edit manually.
      [Unit]
      RequiresMountsFor={{ medusa_host_mounts | map(attribute='mountpoint') | join(' ') }}
  become: true
  when:
    - medusa_host_mounts | length > 0
    - "'docker.service' in (ansible_facts.services | default({}))"
  notify: Reload systemd daemon
