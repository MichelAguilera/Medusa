---
- name: Load generated storage manifest
  ansible.builtin.include_vars:
    file: "{{ medusa_generated_dir }}/storage-manifest.yaml"
    name: medusa_storage_manifest
  delegate_to: localhost
  become: false
  run_once: true

- name: Select mounts for this host
  ansible.builtin.set_fact:
    medusa_host_mounts: >-
      {{ medusa_storage_manifest.hosts[inventory_hostname] | default([]) }}

- name: Ensure mountpoint directories exist
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Check managed NFS source host resolution
  ansible.builtin.command:
    cmd: "getent hosts {{ item.source | regex_replace(':.*$', '') }}"
  changed_when: false
  failed_when: false
  register: medusa_nfs_source_resolution
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.source | regex_replace(':.*$', '') }}"

- name: Fail when managed NFS source host does not resolve
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} cannot resolve NFS source host
      '{{ item.item.source | regex_replace(':.*$', '') }}' for mount
      {{ item.item.mountpoint }} (source {{ item.item.source }}). Fix target-side
      DNS/hosts resolution before mounting managed storage.
  loop: "{{ medusa_nfs_source_resolution.results | default([]) }}"
  loop_control:
    label: "{{ item.item.mountpoint }}"
  when: item.rc != 0

- name: Mount and persist managed NFS mounts
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "{{ item.source }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }}"
    state: mounted
  become: true
  loop: "{{ medusa_host_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Detect installed services
  ansible.builtin.service_facts:
  when: medusa_host_mounts | length > 0

- name: Ensure docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: true
  when:
    - medusa_host_mounts | length > 0
    - "'docker.service' in (ansible_facts.services | default({}))"

- name: Make docker.service wait for managed mounts
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/medusa-mounts.conf
    mode: "0644"
    content: |
      # Generated by Medusa. Do not edit manually.
      [Unit]
      RequiresMountsFor={{ medusa_host_mounts | map(attribute='mountpoint') | join(' ') }}
  become: true
  when:
    - medusa_host_mounts | length > 0
    - "'docker.service' in (ansible_facts.services | default({}))"
  notify: Reload systemd daemon
