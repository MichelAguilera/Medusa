---
# Seconds the host waits before auto-reverting the networkd cutover if the
# controller does not confirm a good cutover (identity-verified reachability
# at the canonical IP). The revert fires from a transient systemd timer on
# the host, independent of the SSH session that the IP change severs.
medusa_net_rollback_seconds: 120

# Path of the Medusa-managed systemd-networkd unit on the target. Numbered
# high so it wins over distro defaults; removing it is part of the rollback.
medusa_networkd_path: /etc/systemd/network/60-medusa.network

# Backups the rollback restores to: the pre-cutover /etc/network/interfaces
# (so ifupdown can reclaim the NIC) and resolv.conf. Created once, on the
# first cutover, and never overwritten on re-runs.
medusa_interfaces_backup: /etc/network/interfaces.medusa-bak
medusa_resolv_backup: /etc/resolv.conf.medusa-bak
