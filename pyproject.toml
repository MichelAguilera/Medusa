[project]
name = "medusa"
version = "0.6.0"
description = "Homelab infrastructure source-of-truth and config generator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "ruamel.yaml>=0.18.0",
    "typer>=0.12.0",
]

[project.scripts]
medusa = "medusa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
